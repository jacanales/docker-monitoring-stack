name: docker-monitoring-stack

services:
  traefik:
    image: traefik:v3.7.15
    networks:
      - traefik
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # Static configuration; the image reads this path by default, the flag
      # only makes the wiring explicit.
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    command:
      - --configFile=/etc/traefik/traefik.yml
  whoami:
    image: "traefik/whoami:v1.12.0"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.docker.localhost`)"
  influxdb:
    image: influxdb:3.12.1-core
    environment:
      INFLUXDB3_HOST_URL: http://127.0.0.1:8181
      INFLUXDB3_AUTH_TOKEN: ${INFLUXDB3_AUTH_TOKEN:?run make token}
    secrets:
      - influxdb-admin-token
    volumes:
      - influxdb3:/var/lib/influxdb3
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "/usr/bin/influxdb3", "show", "databases"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - backend
    labels:
      - "traefik.enable=false"
      - "container_group=monitoring"
    # InfluxDB 3 Core has no environment-driven database bootstrap: the database
    # is created by the one-shot influxdb-init service below.
    #
    # The official image enables the Processing Engine through
    # INFLUXDB3_PLUGIN_DIR=/plugins, which forces Python environment
    # initialization. This stack ships no plugins and an empty value does not
    # disable the engine, so it is unset explicitly and the flags are passed
    # straight to `influxdb3 serve`.
    entrypoint:
      - /bin/bash
      - -c
      - unset INFLUXDB3_PLUGIN_DIR && exec influxdb3 serve "$$@"
      - --
    command:
      - --node-id=influxdb
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --admin-token-file=/run/secrets/influxdb-admin-token
  influxdb-init:
    image: influxdb:3.12.1-core
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      INFLUXDB3_HOST_URL: http://influxdb:8181
      INFLUXDB3_AUTH_TOKEN: ${INFLUXDB3_AUTH_TOKEN:?run make token}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        if out="$$(influxdb3 create database telegraf 2>&1)"; then
          echo "created database 'telegraf'"
          exit 0
        fi
        printf '%s\n' "$$out" >&2
        case "$$out" in
          *already\ exists*) echo "database 'telegraf' already exists" ;;
          *) exit 1 ;;
        esac
    networks:
      - backend
    labels:
      - "traefik.enable=false"
      - "container_group=monitoring"
  telegraf:
    image: telegraf:1.40.2
    environment:
      INFLUXDB3_AUTH_TOKEN: ${INFLUXDB3_AUTH_TOKEN:?run make token}
    volumes:
      - ./config/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./config/telegraf/bin:/code/bin
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - backend
    ports:
      - 8125:8125/udp
    labels:
      - "traefik.enable=false"
      - "container_group=monitoring"
  grafana:
    image: grafana/grafana:13.2.4
    restart: always
    environment:
      - GF_SERVER_ROOT_URL=http://grafana.localhost
      - GF_SECURITY_ADMIN_PASSWORD=GrafanaPassword
      # grafana-simple-json-datasource, grafana-worldmap-panel and
      # raintank-worldping-app are deprecated upstream: the JSON data source is
      # replaced by Infinity and the world map by Grafana's built-in Geomap.
      - GF_INSTALL_PLUGINS=grafana-clock-panel,jdbranham-diagram-panel,yesoreyeram-infinity-datasource
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SERVER_DOMAIN=localhost
    volumes:
      - grafana:/var/lib/grafana
    networks:
      - traefik
      - backend
    ports:
      - 3000:3000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      # Grafana is attached to two networks, so Traefik has to be told which one
      # to use. The prefix is the Compose project name pinned at the top.
      - "traefik.docker.network=docker-monitoring-stack_traefik"
      - "container_group=monitoring"
networks:
  backend:
  traefik:

volumes:
  grafana:
  # Fresh volume for the InfluxDB 3 Core engine. The InfluxDB 1.x volume
  # ("influxdb") is left untouched; its data is not readable by InfluxDB 3.
  influxdb3:
secrets:
  influxdb-admin-token:
    file: ./config/influxdb3/admin-token.json
